/* A lamp-lit desk fills the screen; frosted-glass pills float over it: title (top left), page (top right), controls (bottom). */
:root{
  --desk:#24170F;
  --glass:rgba(250,244,234,.62);
  --glass-line:rgba(255,255,255,.55);
  --ink:#2A2230;
  --ink-dim:#6B5E58;
  --red:#B8372D;
  --gold:#E2BE6A;
  --f-book:"ZCOOL XiaoWei","Songti SC","STSong","SimSun",serif;
  --f-ui:system-ui,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  color-scheme:dark;
}
html{box-sizing:border-box;height:100%;background:var(--desk)}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{height:100%;margin:0;background:var(--desk);color:var(--ink);font-family:var(--f-ui);overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;cursor:pointer}
#stage{position:fixed;inset:0;overflow:hidden;touch-action:none;background:var(--desk)}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.glass{background:var(--glass);border:1px solid var(--glass-line);box-shadow:0 8px 30px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.6);-webkit-backdrop-filter:blur(14px) saturate(1.2);backdrop-filter:blur(14px) saturate(1.2)}
.brand{position:absolute;left:max(14px,env(safe-area-inset-left,0px));top:max(12px,env(safe-area-inset-top,0px));display:flex;align-items:baseline;gap:12px;padding:9px 20px;border-radius:999px;max-width:calc(100% - 200px)}
.brand b{font-family:var(--f-book);font-weight:400;font-size:24px;letter-spacing:.12em;white-space:nowrap}
.brand small{font-family:var(--f-book);font-size:13px;letter-spacing:.2em;color:var(--ink-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.page{position:absolute;right:max(14px,env(safe-area-inset-right,0px));top:max(12px,env(safe-area-inset-top,0px));display:flex;align-items:center;gap:8px;padding:10px 18px;border-radius:999px;font-family:var(--f-book);font-size:16px;letter-spacing:.1em;white-space:nowrap}
.page::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--red);box-shadow:0 0 0 3px rgba(184,55,45,.18)}
.bar{position:absolute;left:50%;transform:translateX(-50%);bottom:max(14px,env(safe-area-inset-bottom,0px));width:min(760px,calc(100% - 28px));display:flex;align-items:center;gap:10px;padding:8px 8px 8px 10px;border-radius:999px}
.nb{flex:none;width:38px;height:38px;border:0;border-radius:50%;background:transparent;display:grid;place-items:center}
.nb:hover{background:rgba(255,255,255,.5)}
.nb svg{width:18px;height:18px}
.dots{flex:none;display:flex;gap:5px;align-items:center}
.dot{width:7px;height:7px;padding:0;border:0;border-radius:4px;background:rgba(42,34,48,.25);transition:width .3s,background .3s}
.dot.on{width:22px;background:var(--ink)}
.cap{flex:1;min-width:0;padding:0 6px}
.cap b{display:block;font-family:var(--f-book);font-weight:400;font-size:19px;letter-spacing:.08em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cap span{display:block;font-family:var(--f-book);font-size:13px;color:var(--ink-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.04em}
.ib{flex:none;width:38px;height:38px;border:0;border-radius:50%;background:transparent;display:grid;place-items:center}
.ib:hover,.ib[aria-pressed="true"]{background:rgba(255,255,255,.6)}
.ib svg{width:20px;height:20px}
.act{flex:none;height:44px;padding:0 22px;border:0;border-radius:999px;background:#17121A;color:#FFF8EC;font-family:var(--f-book);font-size:17px;letter-spacing:.12em;white-space:nowrap;box-shadow:0 4px 12px rgba(0,0,0,.25);transition:transform .12s,background .12s}
.act:hover{background:#2C2230}
.act.press,.nb.press{transform:scale(.92);background:#3A2C36}
.nb.press{background:rgba(255,255,255,.7)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
@media (max-width:620px){.dots,.ib.hide-sm{display:none}.brand small{display:none}.act{padding:0 14px;font-size:15px}.cap b{font-size:17px}}
.intro{position:absolute;left:max(56px,6vw);top:50%;transform:translateY(-58%);max-width:min(470px,42vw);color:#FFF4E2;pointer-events:none}
.intro h1{margin:0;font-family:var(--f-book);font-weight:400;font-size:clamp(28px,3.3vw,48px);line-height:1.25;letter-spacing:.06em;text-shadow:0 2px 16px rgba(0,0,0,.5)}
.intro p{margin:18px 0 26px;font-family:var(--f-book);font-size:16px;line-height:1.7;color:#E9D9C0;letter-spacing:.04em}
.intro button{pointer-events:auto;height:46px;padding:0 26px;border:0;border-radius:999px;background:#FFF4E2;color:#1E1712;font-family:var(--f-book);font-size:18px;letter-spacing:.16em}
@media (max-width:720px){.intro{left:20px;right:20px;top:auto;bottom:96px;transform:none;max-width:none}.intro p{display:none}}
.card{position:absolute;right:max(18px,3vw);top:76px;width:min(380px,calc(100% - 36px));padding:20px 24px;border-radius:20px;opacity:0;transform:translateY(-8px);transition:opacity .3s,transform .3s;pointer-events:none}
.card.on{opacity:1;transform:none}
.card small{display:block;color:var(--red);font-family:var(--f-book);font-size:13px;letter-spacing:.2em}
.card b{display:block;font-family:var(--f-book);font-weight:400;font-size:28px;margin:4px 0 8px}
.card p{margin:0;font-family:var(--f-book);font-size:17px;line-height:1.75}
.bubbles{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.bub{position:absolute;transform:translate(-50%,-100%);max-width:min(260px,70vw);background:#FFF9EC;color:var(--ink);border:1.5px solid #2A2440;border-radius:14px;padding:7px 12px;font-family:var(--f-book);font-size:16px;line-height:1.45;box-shadow:0 4px 0 rgba(42,36,64,.85);text-align:center}
.bub::after{content:"";position:absolute;left:50%;bottom:-8px;width:12px;height:12px;background:#FFF9EC;border-right:1.5px solid #2A2440;border-bottom:1.5px solid #2A2440;transform:translateX(-50%) rotate(45deg)}
body:not(.film) .bub{width:max-content}
.credit{position:absolute;right:18px;bottom:22px;font-size:12px;color:rgba(255,240,220,.45);font-family:var(--f-book);letter-spacing:.1em;pointer-events:none}
@media (max-width:900px){.credit{display:none}}
#loading{position:absolute;inset:0;display:grid;place-items:center;background:var(--desk);z-index:30;transition:opacity .5s}
#loading .box{text-align:center;font-family:var(--f-book);color:#FFF4E2}
#loading .t{font-size:30px;letter-spacing:.2em;margin-bottom:12px}
#loading .lb{width:200px;height:4px;border-radius:2px;background:#4A3424;overflow:hidden;margin:0 auto}
#loading .lb i{display:block;height:100%;width:0;background:var(--gold);transition:width .2s}
.endcard{position:absolute;inset:0;display:none;place-items:center;opacity:0;background:radial-gradient(ellipse at center,rgba(14,10,8,.5),rgba(14,10,8,.82));pointer-events:none}
.endcard .ec{text-align:center;font-family:var(--f-book)}
.endcard b{display:block;font-weight:400;font-size:84px;letter-spacing:.12em;color:#F6DB98;text-shadow:0 4px 24px rgba(0,0,0,.6)}
.endcard small{display:block;margin-top:18px;font-size:34px;letter-spacing:.3em;color:#FFF4E2}
.endcard em{display:block;font-style:normal;color:var(--gold);font-size:30px;letter-spacing:1em;margin:0 0 18px 1em}
/* film: same interface, scaled for 1080p, no transitions (frames are stepped in simulated time) */
body.film *{transition:none!important;animation:none!important}
body.film .endcard{display:grid}
body.film .brand{left:34px;top:28px;padding:14px 30px}
body.film .brand b{font-size:34px}
body.film .brand small{font-size:18px}
body.film .page{right:34px;top:28px;padding:14px 26px;font-size:22px}
body.film .bar{width:1080px;bottom:30px;padding:12px 12px 12px 16px;gap:16px}
body.film .nb,body.film .ib{width:52px;height:52px}
body.film .nb svg{width:24px;height:24px}
body.film .ib svg{width:26px;height:26px}
body.film .dot{width:10px;height:10px;border-radius:5px}
body.film .dot.on{width:32px}
body.film .cap b{font-size:27px}
body.film .cap span{font-size:18px}
body.film .act{height:62px;padding:0 34px;font-size:24px}
body.film .intro{left:120px;max-width:700px}
body.film .intro h1{font-size:68px}
body.film .intro p{font-size:24px}
body.film .intro button{height:64px;padding:0 40px;font-size:26px}
body.film .bub{font-size:28px;padding:10px 20px;border-radius:18px;border-width:2px;max-width:520px;box-shadow:0 5px 0 rgba(42,36,64,.85)}
body.film .credit{display:none}
.bub .en,.vsub .en{display:block;font-family:Georgia,"Times New Roman",serif;font-size:.7em;line-height:1.3;margin-top:3px;opacity:.9}
.vsub{position:absolute;left:50%;bottom:104px;transform:translateX(-50%);max-width:min(900px,92vw);text-align:center;font-family:var(--f-book);font-size:22px;letter-spacing:.04em;color:#FFF8E8;text-shadow:0 2px 8px rgba(0,0,0,.8);background:rgba(20,13,9,.55);padding:8px 22px;border-radius:12px;opacity:0;transition:opacity .3s;pointer-events:none}
.vsub.on{opacity:1}
body.film .vsub{font-size:34px;bottom:130px;max-width:1600px;white-space:nowrap}
body.film .intro{display:none}
</style>
